<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Sync — Flexible Cycle & Deficit Tracker</title>
  <!-- Embedded Tab Favicon (Minimalist Moon) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%2300CEC9' d='M12.3 2.05C11.9 2 11.6 2.2 11.5 2.6C10.5 6.4 12 10.6 15.4 12.8C16.9 13.8 18.6 14.3 20.3 14.4C20.7 14.4 21.1 14.1 21.1 13.7C21.2 9.5 17.8 5.8 13.7 2.1C13.2 1.9 12.7 1.9 12.3 2.05M11.5 5.5C8 7.3 5.6 11 5.9 15.1C6.2 19.3 9.9 22.5 14.1 22.2C17.2 22 20 20 21.2 17.2C18.2 17.3 15.3 16 13.1 13.8C11.3 12 10.3 9.6 10.5 7.1C10.6 6.5 11 6 11.5 5.5Z'/></svg>">
  <style>
    :root {
      --bg: #090B10;
      --card-bg: rgba(18, 22, 33, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-active: rgba(0, 206, 201, 0.35);
      --accent: #6C5CE7;
      --accent-glow: rgba(108, 92, 231, 0.35);
      --cyan: #00CEC9;
      --cyan-glow: rgba(0, 206, 201, 0.3);
      --warning: #FF7675;
      --warning-glow: rgba(255, 118, 117, 0.35);
      --success: #00B894;
      --success-glow: rgba(0, 184, 148, 0.3);
      --text: #F1F2F6;
      --text-dim: #A4B0BE;
      --dropdown-bg: #121621;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(108, 92, 231, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(0, 206, 201, 0.15) 0%, transparent 45%);
      background-attachment: fixed;
    }

    .app-container {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 4px;
    }

    header h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
      background: linear-gradient(135deg, #FFFFFF 0%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 14px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* Status Banner */
    .status-banner {
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.5;
      display: none;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .status-banner.error {
      display: block;
      background: rgba(255, 118, 117, 0.12);
      border: 1px solid rgba(255, 118, 117, 0.4);
      color: #ff9999;
    }

    .status-banner.success {
      display: block;
      background: rgba(0, 184, 148, 0.12);
      border: 1px solid rgba(0, 184, 148, 0.4);
      color: #55efc4;
    }

    /* Metrics Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
      position: relative;
      overflow: hidden;
    }

    .metric-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--cyan));
      opacity: 0.8;
    }

    .metric-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      font-weight: 600;
    }

    .metric-value {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .metric-value.alert {
      color: var(--warning);
      text-shadow: 0 0 12px var(--warning-glow);
    }

    .metric-value.cyan {
      color: var(--cyan);
      text-shadow: 0 0 12px var(--cyan-glow);
    }

    .metric-sub {
      font-size: 12px;
      color: var(--text-dim);
    }

    /* Target Config Card */
    .config-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .config-card h3 {
      font-size: 15px;
      color: var(--cyan);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .config-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    input[type="time"], input[type="number"], select {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: var(--text);
      padding: 9px 12px;
      font-size: 13px;
      outline: none;
      width: 100%;
      transition: all 0.2s ease;
    }

    select option {
      background-color: var(--dropdown-bg);
      color: var(--text);
      padding: 10px;
    }

    input:focus, select:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 8px var(--cyan-glow);
    }

    /* Schedule Section */
    .schedule-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .controls-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Toggle Switch Style */
    .toggle-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-dim);
      font-weight: 500;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.15);
      transition: .3s;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background-color: var(--text);
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--cyan);
      box-shadow: 0 0 8px var(--cyan-glow);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
      background-color: #000;
    }

    /* Day Row Layout */
    .day-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid transparent;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.2s ease;
    }

    .day-row.is-today {
      background: rgba(108, 92, 231, 0.12);
      border-color: var(--card-border-active);
      box-shadow: 0 0 15px rgba(0, 206, 201, 0.08);
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .day-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .day-name {
      font-weight: 700;
      font-size: 15px;
    }

    .today-pill {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--accent) 0%, var(--cyan) 100%);
      color: #FFF;
      padding: 2px 6px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    /* Input Mode Selector Tabs */
    .mode-selector {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #FFF;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    /* Inputs Row */
    .inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .time-wrap, .duration-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cycle-badge {
      font-size: 13px;
      font-weight: 700;
      color: var(--cyan);
      background: rgba(0, 206, 201, 0.1);
      border: 1px solid rgba(0, 206, 201, 0.25);
      padding: 6px 12px;
      border-radius: 10px;
      text-align: center;
      min-width: 90px;
    }

    .recommended-bedtime {
      font-size: 11px;
      color: var(--cyan);
      font-weight: 600;
      margin-top: 2px;
      text-align: right;
    }

    /* Action Buttons */
    .btn-container {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .btn-primary {
      flex: 2;
      min-width: 180px;
      background: linear-gradient(135deg, var(--accent) 0%, #5130A4 100%);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--accent-glow);
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      flex: 1;
      min-width: 110px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-dim);
      padding: 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.2);
    }

    @media (max-width: 700px) {
      .inputs-grid {
        grid-template-columns: 1fr;
      }
      .day-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .mode-selector {
        width: 100%;
        justify-content: space-between;
      }
      .mode-btn {
        flex: 1;
        text-align: center;
      }
      .cycle-badge {
        text-align: left;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>SLEEP SYNC</h1>
      <p>Personalized Hybrid Cycle & Deficit Optimization Engine</p>
    </header>

    <!-- Status Banner for Feasibility Warnings -->
    <div id="feasibility-banner" class="status-banner"></div>

    <!-- Top Metric Cards -->
    <div class="dashboard-grid">
      <div class="metric-card">
        <span class="metric-title">Accumulated Deficit (Sun–Thu)</span>
        <span class="metric-value alert" id="deficit-value">0.0 hrs</span>
        <span class="metric-sub" id="deficit-sub">0.0 cycles behind baseline</span>
      </div>

      <div class="metric-card">
        <span class="metric-title">Remaining Nights Avg</span>
        <span class="metric-value cyan" id="min-sleep-value">--</span>
        <span class="metric-sub" id="min-sleep-sub">Required to hit deficit target</span>
      </div>
    </div>

    <!-- Target Config Card -->
    <div class="config-card">
      <h3>
        <span>Target Weekly Sleep Deficit</span>
      </h3>
      <div class="config-grid">
        <div class="input-group">
          <label>Target Deficit for Week (Hours)</label>
          <input type="number" id="target-deficit-input" value="4.0" step="0.5" min="0" max="30" oninput="saveAndCalculate()">
        </div>
      </div>
    </div>

    <!-- Weekly Log -->
    <div class="schedule-card">
      <div class="section-title">
        <span>Weekly Log (Sun – Sat)</span>
        <div class="controls-wrapper">
          <div class="toggle-container">
            <span>Nap Penalty (0.8x)</span>
            <label class="switch">
              <input type="checkbox" id="nap-penalty-toggle" onchange="saveAndCalculate()">
              <span class="slider"></span>
            </label>
          </div>
          <div class="toggle-container">
            <span>Round Cycles</span>
            <label class="switch">
              <input type="checkbox" id="round-toggle" onchange="saveAndCalculate()">
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>

      <form id="sleep-form">
        <div id="days-container"></div>

        <div class="btn-container">
          <button type="button" class="btn-primary" onclick="calculateDeficit()">Recalculate Protocol</button>
          <button type="button" class="btn-secondary" onclick="presetRecentContext()">Fill Context</button>
          <button type="button" class="btn-secondary" onclick="resetForm()">Reset Log</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const BASELINE_CYCLES = 5.0; 
    const TODAY_INDEX = new Date().getDay(); // 4 for Thursday

    const activeModes = Array(7).fill('time');
    const earliestBedtimes = Array(7).fill('');

    function convertMinutesToCycles(minutes, shouldRound = false) {
      if (minutes <= 0 || isNaN(minutes)) return 0;
      const sleepMin = Math.max(0, minutes - 15);
      
      let exactCycles = 0;
      if (sleepMin <= 285) {
        exactCycles = sleepMin / 95.0;
      } else {
        const remainingMin = sleepMin - 285;
        exactCycles = 3.0 + (remainingMin / 90.0);
      }
      
      if (shouldRound) {
        return Math.round(exactCycles);
      }
      return exactCycles;
    }

    function convertCyclesToMinutes(cycles) {
      if (cycles <= 0) return 0;
      let sleepMin = 0;
      if (cycles <= 3) {
        sleepMin = cycles * 95.0;
      } else {
        sleepMin = 285 + ((cycles - 3.0) * 90.0);
      }
      return Math.round(sleepMin + 15);
    }

    function formatTime12hFromMinutes(totalMins) {
      let normalized = Math.round(totalMins) % 1440;
      if (normalized < 0) normalized += 1440;
      const h24 = Math.floor(normalized / 60);
      const m = Math.round(normalized % 60);
      const period = h24 >= 12 ? 'PM' : 'AM';
      let h12 = h24 % 12;
      if (h12 === 0) h12 = 12;
      return `${h12}:${m.toString().padStart(2, '0')} ${period}`;
    }

    function timeStrToMinutes(timeStr) {
      if (!timeStr) return null;
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    }

    function renderDays() {
      const container = document.getElementById('days-container');

      container.innerHTML = days.map((day, idx) => {
        const isToday = idx === TODAY_INDEX;
        const mode = activeModes[idx];

        return `
          <div class="day-row ${isToday ? 'is-today' : ''}" id="day-row-${idx}">
            <div class="day-header">
              <div class="day-title">
                <span class="day-name">${day}</span>
                ${isToday ? '<span class="today-pill">Today</span>' : ''}
              </div>
              <div class="mode-selector">
                <button type="button" class="mode-btn ${mode === 'time' ? 'active' : ''}" onclick="setMode(${idx}, 'time')">Bed Time</button>
                <button type="button" class="mode-btn ${mode === 'duration' ? 'active' : ''}" onclick="setMode(${idx}, 'duration')">Duration</button>
                <button type="button" class="mode-btn ${mode === 'cycles' ? 'active' : ''}" onclick="setMode(${idx}, 'cycles')">Cycles</button>
              </div>
            </div>

            <div class="inputs-grid">
              <!-- Earliest Bedtime Limit -->
              <div class="input-group">
                <label>Earliest Bedtime <span style="font-weight:normal; color:var(--text-dim);">(Limit)</span></label>
                <input type="time" id="earliest-${idx}" value="${earliestBedtimes[idx]}" onchange="updateEarliest(${idx}, this.value)" placeholder="Any">
              </div>

              <!-- Mode 1: Time in Bed -->
              <div class="input-group" id="group-time-${idx}" style="display: ${mode === 'time' ? 'flex' : 'none'};">
                <label>Bed Time – Wake Time</label>
                <div class="time-wrap">
                  <input type="time" id="bed-${idx}" onchange="saveAndCalculate()">
                  <span style="font-size:11px; color:var(--text-dim);">to</span>
                  <input type="time" id="wake-${idx}" value="06:15" onchange="saveAndCalculate()">
                </div>
              </div>

              <!-- Mode 2: Duration of Sleep -->
              <div class="input-group" id="group-duration-${idx}" style="display: ${mode === 'duration' ? 'flex' : 'none'};">
                <label>Hours & Minutes</label>
                <div class="duration-wrap">
                  <input type="number" id="dur-h-${idx}" min="0" max="18" placeholder="6" style="width: 70px;" oninput="saveAndCalculate()">
                  <span style="font-size:11px; color:var(--text-dim);">h</span>
                  <input type="number" id="dur-m-${idx}" min="0" max="59" step="5" placeholder="30" style="width: 70px;" oninput="saveAndCalculate()">
                  <span style="font-size:11px; color:var(--text-dim);">m</span>
                </div>
              </div>

              <!-- Mode 3: Cycle Dropdown -->
              <div class="input-group" id="group-cycles-${idx}" style="display: ${mode === 'cycles' ? 'flex' : 'none'};">
                <label>Overnight Cycles</label>
                <select id="cycles-select-${idx}" onchange="saveAndCalculate()">
                  <option value="none">-- Not Logged --</option>
                  <option value="6">6 Cycles (9.25h)</option>
                  <option value="5">5 Cycles (7.75h)</option>
                  <option value="4">4 Cycles (6.25h)</option>
                  <option value="3">3 Cycles (5.00h)</option>
                  <option value="2">2 Cycles (3.42h)</option>
                  <option value="1">1 Cycle (1.83h)</option>
                  <option value="0">0 Cycles (0.0h)</option>
                </select>
              </div>

              <!-- Day Nap -->
              <div class="input-group">
                <label>Day Nap</label>
                <select id="nap-${idx}" onchange="saveAndCalculate()">
                  <option value="0">None</option>
                  <option value="0.22">Power Nap (20m)</option>
                  <option value="1">1 Cycle Nap (90m)</option>
                  <option value="2">2 Cycle Nap (180m)</option>
                </select>
              </div>

              <!-- Calculated Total Output -->
              <div style="display: flex; flex-direction: column; justify-content: flex-end;">
                <div class="cycle-badge" id="cycles-display-${idx}">--</div>
                <div class="recommended-bedtime" id="rec-display-${idx}"></div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function setMode(dayIdx, mode) {
      activeModes[dayIdx] = mode;
      
      const row = document.getElementById(`day-row-${dayIdx}`);
      if (row) {
        const btns = row.querySelectorAll('.mode-btn');
        btns[0].className = `mode-btn ${mode === 'time' ? 'active' : ''}`;
        btns[1].className = `mode-btn ${mode === 'duration' ? 'active' : ''}`;
        btns[2].className = `mode-btn ${mode === 'cycles' ? 'active' : ''}`;

        document.getElementById(`group-time-${dayIdx}`).style.display = mode === 'time' ? 'flex' : 'none';
        document.getElementById(`group-duration-${dayIdx}`).style.display = mode === 'duration' ? 'flex' : 'none';
        document.getElementById(`group-cycles-${dayIdx}`).style.display = mode === 'cycles' ? 'flex' : 'none';
      }

      saveAndCalculate();
    }

    function updateEarliest(dayIdx, val) {
      earliestBedtimes[dayIdx] = val;
      saveAndCalculate();
    }

    function presetRecentContext() {
      const presetData = [
        { mode: 'time', bed: '02:00', wake: '07:15', nap: '0' }, // Sun
        { mode: 'time', bed: '01:30', wake: '06:15', nap: '0' }, // Mon
        { mode: 'time', bed: '00:45', wake: '05:15', nap: '0' }, // Tue
        { mode: 'time', bed: '01:15', wake: '06:15', nap: '0' }  // Wed
      ];

      presetData.forEach((d, idx) => {
        setMode(idx, d.mode);
        document.getElementById(`bed-${idx}`).value = d.bed;
        document.getElementById(`wake-${idx}`).value = d.wake;
        document.getElementById(`nap-${idx}`).value = d.nap;
      });

      saveAndCalculate();
    }

    function resetForm() {
      days.forEach((_, idx) => {
        setMode(idx, 'time');
        earliestBedtimes[idx] = '';
        const earliestInput = document.getElementById(`earliest-${idx}`);
        const bedInput = document.getElementById(`bed-${idx}`);
        const wakeInput = document.getElementById(`wake-${idx}`);
        const durHInput = document.getElementById(`dur-h-${idx}`);
        const durMInput = document.getElementById(`dur-m-${idx}`);
        const cycSelect = document.getElementById(`cycles-select-${idx}`);
        const napSelect = document.getElementById(`nap-${idx}`);
        const display = document.getElementById(`cycles-display-${idx}`);
        const recDisplay = document.getElementById(`rec-display-${idx}`);

        if (earliestInput) earliestInput.value = '';
        if (bedInput) bedInput.value = '';
        if (wakeInput) wakeInput.value = '06:15';
        if (durHInput) durHInput.value = '';
        if (durMInput) durMInput.value = '';
        if (cycSelect) cycSelect.value = 'none';
        if (napSelect) napSelect.value = '0';
        if (display) display.innerText = '--';
        if (recDisplay) recDisplay.innerText = '';
      });
      document.getElementById('target-deficit-input').value = '4.0';
      localStorage.removeItem('sleepSyncData');
      calculateDeficit();
    }

    function saveAndCalculate() {
      const dataToSave = {
        modes: activeModes,
        earliestBedtimes: earliestBedtimes,
        targetDeficit: document.getElementById('target-deficit-input')?.value || '4.0',
        roundToggle: document.getElementById('round-toggle')?.checked || false,
        napPenaltyToggle: document.getElementById('nap-penalty-toggle')?.checked || false,
        days: days.map((_, idx) => ({
          bed: document.getElementById(`bed-${idx}`)?.value || '',
          wake: document.getElementById(`wake-${idx}`)?.value || '06:15',
          durH: document.getElementById(`dur-h-${idx}`)?.value || '',
          durM: document.getElementById(`dur-m-${idx}`)?.value || '',
          cycles: document.getElementById(`cycles-select-${idx}`)?.value || 'none',
          nap: document.getElementById(`nap-${idx}`)?.value || '0'
        }))
      };
      localStorage.setItem('sleepSyncData', JSON.stringify(dataToSave));
      calculateDeficit();
    }

    function loadSavedData() {
      const saved = localStorage.getItem('sleepSyncData');
      if (!saved) return false;
      try {
        const parsed = JSON.parse(saved);
        if (parsed.modes) {
          parsed.modes.forEach((m, idx) => activeModes[idx] = m);
        }
        if (parsed.earliestBedtimes) {
          parsed.earliestBedtimes.forEach((e, idx) => earliestBedtimes[idx] = e);
        }
        if (parsed.targetDeficit !== undefined) {
          const targetInput = document.getElementById('target-deficit-input');
          if (targetInput) targetInput.value = parsed.targetDeficit;
        }
        if (parsed.roundToggle !== undefined) {
          const toggle = document.getElementById('round-toggle');
          if (toggle) toggle.checked = parsed.roundToggle;
        }
        if (parsed.napPenaltyToggle !== undefined) {
          const napToggle = document.getElementById('nap-penalty-toggle');
          if (napToggle) napToggle.checked = parsed.napPenaltyToggle;
        }
        renderDays();
        if (parsed.days) {
          parsed.days.forEach((d, idx) => {
            if (document.getElementById(`earliest-${idx}`)) document.getElementById(`earliest-${idx}`).value = earliestBedtimes[idx];
            if (document.getElementById(`bed-${idx}`)) document.getElementById(`bed-${idx}`).value = d.bed;
            if (document.getElementById(`wake-${idx}`)) document.getElementById(`wake-${idx}`).value = d.wake;
            if (document.getElementById(`dur-h-${idx}`)) document.getElementById(`dur-h-${idx}`).value = d.durH;
            if (document.getElementById(`dur-m-${idx}`)) document.getElementById(`dur-m-${idx}`).value = d.durM;
            if (document.getElementById(`cycles-select-${idx}`)) document.getElementById(`cycles-select-${idx}`).value = d.cycles;
            if (document.getElementById(`nap-${idx}`)) document.getElementById(`nap-${idx}`).value = d.nap;
          });
        }
        return true;
      } catch (e) {
        console.error("Error loading saved sleep data", e);
        return false;
      }
    }

    function calculateDeficit() {
      const shouldRound = document.getElementById('round-toggle')?.checked || false;
      const applyNapPenalty = document.getElementById('nap-penalty-toggle')?.checked || false;
      const napMultiplier = applyNapPenalty ? 0.8 : 1.0;
      const targetDeficitHours = parseFloat(document.getElementById('target-deficit-input')?.value) || 4.0;
      const targetDeficitCycles = targetDeficitHours / 1.55; 
      const feasibilityBanner = document.getElementById('feasibility-banner');

      feasibilityBanner.className = 'status-banner';
      feasibilityBanner.style.display = 'none';

      const dayNightCycles = Array(7).fill(null);
      const dayEffectiveNap = Array(7).fill(0);

      days.forEach((_, idx) => {
        const mode = activeModes[idx];
        const rawNapVal = parseFloat(document.getElementById(`nap-${idx}`)?.value) || 0;
        const effectiveNapVal = rawNapVal * napMultiplier;
        dayEffectiveNap[idx] = effectiveNapVal;

        let nightCycles = null;

        if (mode === 'time') {
          const bedVal = document.getElementById(`bed-${idx}`)?.value;
          const wakeVal = document.getElementById(`wake-${idx}`)?.value;
          if (bedVal && wakeVal) {
            const bedDate = new Date(`1970-01-01T${bedVal}:00`);
            let wakeDate = new Date(`1970-01-01T${wakeVal}:00`);
            if (wakeDate <= bedDate) wakeDate.setDate(wakeDate.getDate() + 1);
            const durationMin = (wakeDate - bedDate) / (1000 * 60);
            nightCycles = convertMinutesToCycles(durationMin, shouldRound);
          }
        } else if (mode === 'duration') {
          const h = parseInt(document.getElementById(`dur-h-${idx}`)?.value) || 0;
          const m = parseInt(document.getElementById(`dur-m-${idx}`)?.value) || 0;
          const totalMin = (h * 60) + m;
          if (totalMin > 0) {
            nightCycles = convertMinutesToCycles(totalMin, shouldRound);
          }
        } else if (mode === 'cycles') {
          const selectVal = document.getElementById(`cycles-select-${idx}`)?.value;
          if (selectVal && selectVal !== 'none') {
            nightCycles = parseFloat(selectVal);
          }
        }

        if (nightCycles !== null) {
          dayNightCycles[idx] = nightCycles;
        }
      });

      // 1. Calculate Accumulated Deficit UP TO TODAY (Sun–Thu) strictly based on 5-cycle baseline debt
      let elapsedDeficitCycles = 0;
      
      for (let i = 0; i <= TODAY_INDEX; i++) {
        if (dayNightCycles[i] !== null) {
          const totalLogged = dayNightCycles[i] + dayEffectiveNap[i];
          if (totalLogged < BASELINE_CYCLES) {
            elapsedDeficitCycles += (BASELINE_CYCLES - totalLogged);
          }
        } else {
          // Unlogged past days assume 0 deficit until logged
        }
      }

      const elapsedDeficitHours = (elapsedDeficitCycles * 1.55).toFixed(1);

      document.getElementById('deficit-value').innerText = `${elapsedDeficitHours} hrs`;
      document.getElementById('deficit-sub').innerText = `${elapsedDeficitCycles.toFixed(1)} cycles behind baseline (Sun–Thu)`;

      // 2. Recommendations for remaining days (Today onward) to hit weekly target deficit
      const targetTotalCyclesWeek = (7 * BASELINE_CYCLES) - targetDeficitCycles;
      
      let totalCyclesLoggedWeek = 0;
      days.forEach((_, idx) => {
        if (dayNightCycles[idx] !== null) {
          totalCyclesLoggedWeek += (dayNightCycles[idx] + dayEffectiveNap[idx]);
        }
      });

      const cyclesNeededRemaining = targetTotalCyclesWeek - totalCyclesLoggedWeek;
      const remainingDaysIndices = days.map((_, idx) => idx).filter(idx => idx >= TODAY_INDEX);

      if (remainingDaysIndices.length > 0) {
        let maxPossibleRemainingCycles = 0;
        remainingDaysIndices.forEach(idx => {
          const wakeVal = document.getElementById(`wake-${idx}`)?.value || '06:15';
          const wakeMins = timeStrToMinutes(wakeVal);
          const earliestVal = earliestBedtimes[idx];

          let maxCyclesForDay = 6.0; 
          if (earliestVal) {
            const bedMins = timeStrToMinutes(earliestVal);
            let sleepMin = wakeMins - bedMins;
            if (sleepMin <= 0) sleepMin += 1440;
            maxCyclesForDay = convertMinutesToCycles(sleepMin, false);
          }
          maxPossibleRemainingCycles += (maxCyclesForDay + dayEffectiveNap[idx]);
        });

        if (cyclesNeededRemaining > maxPossibleRemainingCycles) {
          feasibilityBanner.className = 'status-banner error';
          feasibilityBanner.innerHTML = `⚠️ <strong>Target Unreachable:</strong> It is mathematically impossible to reach your target deficit of <strong>${targetDeficitHours.toFixed(1)} hrs</strong> with the earliest bedtime limits specified.`;
        } else {
          let remainingToDistribute = cyclesNeededRemaining;
          const assignedCycles = {};
          let unassignedCount = remainingDaysIndices.length;

          remainingDaysIndices.forEach(idx => {
            const wakeVal = document.getElementById(`wake-${idx}`)?.value || '06:15';
            const wakeMins = timeStrToMinutes(wakeVal);
            const earliestVal = earliestBedtimes[idx];

            let maxCyclesForDay = 6.0;
            if (earliestVal) {
              let bedMins = timeStrToMinutes(earliestVal);
              let sleepMin = wakeMins - bedMins;
              if (sleepMin <= 0) sleepMin += 1440;
              maxCyclesForDay = convertMinutesToCycles(sleepMin, false);
            }

            let idealForDay = remainingToDistribute / unassignedCount;
            let chosenCycles = Math.min(maxCyclesForDay, Math.max(4.0, idealForDay));
            
            assignedCycles[idx] = chosenCycles;
            remainingToDistribute -= chosenCycles;
            unassignedCount--;
          });

          remainingDaysIndices.forEach(idx => {
            const wakeVal = document.getElementById(`wake-${idx}`)?.value || '06:15';
            const wakeMins = timeStrToMinutes(wakeVal);
            const targetCycles = assignedCycles[idx];
            
            let neededSleepMins = convertCyclesToMinutes(targetCycles);
            let recommendedBedtimeMins = wakeMins - neededSleepMins;
            
            if (earliestBedtimes[idx]) {
              let earliestMins = timeStrToMinutes(earliestBedtimes[idx]);
              let diffToEarliest = earliestMins - recommendedBedtimeMins;
              if (diffToEarliest > 0 && diffToEarliest < 720) {
                recommendedBedtimeMins = earliestMins;
              }
            }

            const recTimeStr = formatTime12hFromMinutes(recommendedBedtimeMins);
            const recDisplay = document.getElementById(`rec-display-${idx}`);
            if (recDisplay) {
              recDisplay.innerHTML = `Rec Bedtime: <strong>${recTimeStr}</strong> (${targetCycles.toFixed(1)} cyc)`;
            }
          });
        }
      }

      // Clear past days' recommendations (before Today)
      days.forEach((_, idx) => {
        if (idx < TODAY_INDEX) {
          const recDisplay = document.getElementById(`rec-display-${idx}`);
          if (recDisplay) recDisplay.innerText = '';
        }
      });

      // Render final cycle badges
      days.forEach((_, idx) => {
        const effectiveNapVal = dayEffectiveNap[idx];
        const displayBadge = document.getElementById(`cycles-display-${idx}`);
        let nightCycles = dayNightCycles[idx];

        if (nightCycles !== null) {
          const totalDayCycles = nightCycles + effectiveNapVal;
          if (displayBadge) {
            displayBadge.innerText = shouldRound 
              ? `${Math.round(totalDayCycles)} cyc` 
              : `${totalDayCycles.toFixed(1)} cyc`;
          }
        } else {
          if (displayBadge) displayBadge.innerText = effectiveNapVal > 0 ? `+${effectiveNapVal.toFixed(1)} nap` : '--';
        }
      });

      const minSleepVal = document.getElementById('min-sleep-value');
      const minSleepSub = document.getElementById('min-sleep-sub');

      if (remainingDaysIndices.length > 0) {
        const avgNeededPerNight = Math.max(0, cyclesNeededRemaining / remainingDaysIndices.length);
        minSleepVal.innerText = `${avgNeededPerNight.toFixed(1)} cyc/night`;
        minSleepSub.innerText = `Required across ${remainingDaysIndices.length} remaining nights`;
      } else {
        minSleepVal.innerText = 'Week Complete';
        minSleepSub.innerText = 'All days accounted for';
      }
    }

    window.onload = function() {
      const loaded = loadSavedData();
      if (!loaded) {
        renderDays();
        presetRecentContext();
      } else {
        calculateDeficit();
      }
    };
  </script>
</body>
